# Actas del Comité de Precios.
actas:
  - id: CP-02-2025
    fecha: 2025-02-20
    acuerdos:
      - Se ratifican los topes de descuento comercial de la Política 2025.
      - >-
        Se APRUEBA excepción para Ferretería Santa Rosa 3 (CLI-FER-003): descuento comercial
        de hasta 17 % entre el 01/03/2025 y el 31/12/2026, por abastecer un proyecto minero en
        Arequipa con competencia de producto importado.
    excepciones:
      - {cliente_id: CLI-FER-003, estado: aprobada, concepto: dscto_comercial, tope: 0.17, desde: 2025-03-01, hasta: 2026-12-31}
  - id: CP-09-2025
    fecha: 2025-09-18
    acuerdos:
      - Se aprueba la Grid Comercial del IV Trimestre 2025 para planchas de yeso (7 %) en Ferretería y Distribuidor.
      - Se mantiene el Programa de Marketing Cooperativo Retail 2025 (2 %).
    excepciones: []
  - id: CP-01-2026
    fecha: 2026-01-15
    acuerdos:
      - Se aprueba la Política Comercial de Descuentos 2026; el tope del canal Constructora baja de 14 % a 12 %.
      - Se aprueba el programa de rebates por cumplimiento trimestral para 8 clientes clave mediante cartas comerciales.
      - Se aprueba la Campaña Constructor Andino 2026 (3 % por línea de 300 unidades o más).
    excepciones: []
  - id: CP-02-2026
    fecha: 2026-02-12
    acuerdos:
      - Se aprueba el alza de 6 % en la lista de precios a partir del 01/03/2026.
      - >-
        Se RECHAZA la solicitud de excepción de Ferretería Norteña 11 (CLI-FER-011) por un descuento
        comercial de 15 %; debe mantenerse el tope del canal (7 %).
    excepciones:
      # Rechazada: el acta no fija vigencia (lo correcto es extraer fechas nulas).
      - {cliente_id: CLI-FER-011, estado: rechazada, concepto: dscto_comercial, tope: 0.15, desde: null, hasta: null}
  - id: CP-06-2026
    fecha: 2026-06-18
    acuerdos:
      - Se aprueba la Grid Comercial del III Trimestre 2026 (perfilería, Constructora, 5 %).
      - Se encarga a Pricing auditar los descuentos del canal Ferretería en la región Sur.
    excepciones: []

