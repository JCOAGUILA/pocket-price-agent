# Fuente de verdad de los acuerdos comerciales FUERA de SAP de
# "Andina Materiales de Construcción S.A.C." (empresa ficticia).
#
# De aquí salen:
#   1. Los documentos (PDF/DOCX/MD) que se indexan en el RAG (generate_docs.py).
#   2. Los valores esperados para evaluar la extracción con LLM (LangSmith).
# El agente NUNCA lee este archivo: solo ve los documentos.

empresa:
  razon_social: Andina Materiales de Construcción S.A.C.
  ruc: "20999999991"   # ficticio
  ciudad: Lima

politicas_descuento:
  - id: POL-2025
    titulo: Política Comercial de Descuentos 2025
    fecha_emision: 2025-01-06
    vigencia_desde: 2025-01-01
    vigencia_hasta: 2025-12-31
    topes_comercial:          # % máximo de descuento comercial en factura
      Distribuidor: 0.17
      Constructora: 0.14
      Retail moderno: 0.10
      Ferretería: 0.07
    descuento_volumen: {cantidad_min: 200, tope: 0.06}
    pronto_pago: {plazo_max_dias: 15, pct: 0.02}
  - id: POL-2026
    titulo: Política Comercial de Descuentos 2026
    fecha_emision: 2026-01-08
    vigencia_desde: 2026-01-01
    vigencia_hasta: 2026-12-31
    topes_comercial:
      Distribuidor: 0.17
      Constructora: 0.12        # baja desde 14 % (Acta CP-01-2026)
      Retail moderno: 0.10
      Ferretería: 0.07
    descuento_volumen: {cantidad_min: 200, tope: 0.06}
    pronto_pago: {plazo_max_dias: 15, pct: 0.02}

